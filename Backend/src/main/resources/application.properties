# Database credentials come from the environment (see CLAUDE.md); never commit them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# The table is loaded from stats.csv, not managed by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Comma-separated origin patterns allowed to call /api/**
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,https://*.onrender.com}
